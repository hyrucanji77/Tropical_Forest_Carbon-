name: Publish research source
on:
  push:
    paths:
      - 'publication-parts/READY.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the requested repository commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout -b main FETCH_HEAD
      - name: Verify and publish research package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 publication-parts/publish.py
