name: Build research snapshot
on:
  push:
    paths: [repository_build.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: research-snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the requested source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git clone https://github.com/hyrucanji77/Tropical_Forest_Carbon-.git research
          cd research
          git checkout "$SOURCE_SHA"
      - name: Install document-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-science texlive-plain-generic tex-gyre lmodern cm-super fonts-liberation2 python3-cairosvg poppler-utils
      - name: Reproduce and compile
        run: |
          cd research
          python3 scripts/reproduce.py
          python3 scripts/rebuild_artwork.py
          pdflatex -interaction=nonstopmode -halt-on-error figure_plates.tex > plate-build.log 2>&1 || { tail -100 plate-build.log; exit 1; }
          cp figure_plates.pdf figures/figure_plates.pdf
          bash scripts/build_local.sh > document-build.log 2>&1 || { tail -100 document-build.log; exit 1; }
          pdfinfo main.pdf | grep -E 'Pages:|Page size:|File size:'
          pdfinfo response_to_review.pdf | grep -E 'Pages:|Page size:|File size:'
          python3 scripts/make_manifest.py
          python3 scripts/verify_package.py > verification.json
          python3 scripts/package_release.py
      - name: Deposit generated public research files
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd research
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C main
          git add data figures main.pdf main.bbl response_to_review.pdf response_to_review.bbl manifest.json verification.json release
          if ! git diff --cached --quiet; then
            git commit -m "Build verified research snapshot from ${SOURCE_SHA}"
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push https://github.com/hyrucanji77/Tropical_Forest_Carbon-.git HEAD:main
          fi
      - name: Publish versioned research release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd research
          if gh release view v5.0 --repo hyrucanji77/Tropical_Forest_Carbon- >/dev/null 2>&1; then
            echo 'Existing release left unchanged.'
            exit 0
          fi
          gh release create v5.0 --repo hyrucanji77/Tropical_Forest_Carbon- --target "$(git rev-parse HEAD)" --title 'Forest-carbon measurement — research snapshot 5.0' --notes 'Henry Arellano-Peña. From tropical forest-carbon measurement to annual carbon accounts: Stock-to-flux identities, census calibration and a historical-data audit. Includes compiled manuscript, response to review, vector figures, editable Overleaf project, numerical inputs and outputs, source provenance, SHA-256 manifest and executable verification. Numerical tests reproduce the analytical examples and published-data audit; they are not a new field inventory. This GitHub release has no assigned Zenodo DOI. See RIGHTS.md for methodology, data and figure-attribution terms.' main.pdf response_to_review.pdf figures/figure_plates.pdf release/Tropical_Forest_Carbon_Overleaf_v5.zip verification.json manifest.json
