name: Verify public research package
on:
  push:
    paths:
      - .github/workflows/verify-public-package.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Read the requested public snapshot
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git clone https://github.com/hyrucanji77/Tropical_Forest_Carbon-.git research
          cd research
          git checkout "$SOURCE_SHA"
      - name: Check the distributed Overleaf archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          import subprocess
          p = Path('research/release/Tropical_Forest_Carbon_Overleaf_v5.zip')
          with zipfile.ZipFile(p) as z:
              z.extractall('verified-package')
          root = next(Path('verified-package').rglob('scripts/verify_package.py')).parent.parent
          with open('package-verification.json', 'w') as output:
              subprocess.run(['python3', 'scripts/verify_package.py'], cwd=root, stdout=output, check=True)
          PY
      - name: Attach the verified snapshot
        uses: actions/upload-artifact@v4
        with:
          name: verified-forest-carbon-v5
          path: |
            research/release/Tropical_Forest_Carbon_Overleaf_v5.zip
            package-verification.json
          if-no-files-found: error
          retention-days: 30
