name: Verify publication and numerical evidence
on:
  push:
    branches: [main]
    paths:
      - PUBLICATION_MANIFEST.json
      - PUBLICATION_VERIFICATION.json
      - NUMERICAL_OUTPUTS.json
      - data/**
      - scripts/**
      - '**/*.pdf'
      - README.md
      - CITATION.cff
      - .github/workflows/verify.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check allowed file formats and reproduce numerical evidence
        run: python3 scripts/verify_public.py
