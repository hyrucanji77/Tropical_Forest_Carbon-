name: Verify publication and numerical evidence
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - data/**
      - scripts/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check allowed file formats and reproduce numerical evidence
        run: python3 scripts/verify_public.py
