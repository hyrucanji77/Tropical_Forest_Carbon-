name: Verify frozen research package
on:
  push:
    paths:
      - main.tex
      - scripts/**
      - release/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify_package.py
      - name: Verify distributed archive
        run: |
          python3 -m zipfile -e release/Tropical_Forest_Carbon_Overleaf_v6_5.zip /tmp/overleaf-check
          cd /tmp/overleaf-check
          python3 scripts/verify_package.py
