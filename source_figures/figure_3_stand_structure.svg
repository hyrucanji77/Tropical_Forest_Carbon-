<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2288 1600" role="img" aria-labelledby="physical-title physical-desc" style="font-family:Source Serif 4,Georgia,Liberation Serif,serif">
<title id="physical-title">Independent stand measurements test the mapped target in both directions</title>
<desc id="physical-desc">Five explanations are tested: volume, material properties, remainder compartments, spatial selection and an overestimated mapped target. Class-5 lower edge is a model-class threshold, not a measured field lower bound. Conditional requirements are rounded. Independent measured-minus-mapped residuals can support or reject the target.</desc>
<rect width="2288" height="1600" fill="#f3f2f2"/>
<text x="52" y="42" font-size="26" fill="#006786" font-weight="600" text-anchor="start">INDEPENDENT MEASUREMENT → FORWARD RECONSTRUCTION → TWO-SIDED TEST</text>
<path d="M52 62H2236" stroke="#201e1d" stroke-width="2"/>
<rect x="52" y="88" width="688" height="206" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="128" font-size="26" fill="#006786" font-weight="600" text-anchor="start">01  MEASURE</text>
<rect x="800" y="88" width="688" height="206" fill="#e8eee8" stroke="#bab6b6" stroke-width="1"/>
<text x="824" y="128" font-size="26" fill="#006786" font-weight="600" text-anchor="start">02  RECONSTRUCT</text>
<rect x="1548" y="88" width="688" height="206" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="1572" y="128" font-size="26" fill="#006786" font-weight="600" text-anchor="start">03  COMPARE</text>
<text x="76" y="176" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Stems, basal area, heights and sound organ volume</text>
<text x="76" y="214" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Paired material density and carbon fraction</text>
<text x="76" y="252" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Independent plots; fixed epoch and class</text>
<text x="824" y="176" font-size="26" fill="#186D30" font-weight="400" text-anchor="start">Carbon / ha = β × G × Λ + remainder</text>
<text x="824" y="214" font-size="26" fill="#186D30" font-weight="400" text-anchor="start">Λ = weighted height × weighted architecture</text>
<text x="824" y="252" font-size="26" fill="#186D30" font-weight="400" text-anchor="start">Average plot products; retain covariance</text>
<text x="1572" y="176" font-size="25" fill="#201e1d" font-weight="400" text-anchor="start">Independent measured minus mapped carbon</text>
<text x="1572" y="214" font-size="25" fill="#201e1d" font-weight="400" text-anchor="start">R &lt; 0 can support an overestimated map</text>
<text x="1572" y="252" font-size="25" fill="#201e1d" font-weight="400" text-anchor="start">R &gt; 0 can support an underestimated map</text>
<text x="52" y="337" font-size="27" fill="#006786" font-weight="600" text-anchor="start">CLASS 5 · 531.45 MILLION HECTARES · ABOUT 5.31 MILLION km²</text>
<text x="52" y="370" font-size="23" fill="#201e1d" font-weight="400" text-anchor="start">Comparable in scale to the historical Amazonian forest extent; not the same domain or a current area estimate.</text>
<rect x="52" y="396" width="1225" height="325" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<rect x="1330" y="396" width="906" height="325" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="435" font-size="24" fill="#201e1d" font-weight="600" text-anchor="start">Density basis</text>
<text x="683" y="435" font-size="24" fill="#201e1d" font-weight="600" text-anchor="end">MgC/ha</text>
<text x="914" y="435" font-size="24" fill="#201e1d" font-weight="600" text-anchor="end">Mg dry/ha</text>
<text x="1250" y="435" font-size="24" fill="#201e1d" font-weight="600" text-anchor="end">m³/ha</text>
<path d="M76 453H1252" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="494" font-size="25" fill="#201e1d" font-weight="600" text-anchor="start">Class 5: lower class edge</text>
<text x="683" y="494" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">478</text>
<text x="914" y="494" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,020</text>
<text x="1250" y="494" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,700</text>
<text x="76" y="544" font-size="25" fill="#201e1d" font-weight="600" text-anchor="start">Class 5: printed mean</text>
<text x="683" y="544" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">531.05</text>
<text x="914" y="544" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,130</text>
<text x="1250" y="544" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,880</text>
<text x="76" y="594" font-size="25" fill="#201e1d" font-weight="600" text-anchor="start">Class 5: stock / area</text>
<text x="683" y="594" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">536.33</text>
<text x="914" y="594" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,140</text>
<text x="1250" y="594" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,900</text>
<text x="76" y="644" font-size="25" fill="#201e1d" font-weight="600" text-anchor="start">Classes 4 and 5</text>
<text x="683" y="644" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">472.19</text>
<text x="914" y="644" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,000</text>
<text x="1250" y="644" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">≈ 1,670</text>
<text x="76" y="692" font-size="22" fill="#201e1d" font-weight="400" text-anchor="start">Illustrative f = 0.47; ρ = 0.60 Mg/m³; separate remainder = 0.</text>
<text x="1352" y="432" font-size="24" fill="#201e1d" font-weight="600" text-anchor="start">Fixed biomass denominator</text>
<text x="2070" y="432" font-size="23" fill="#201e1d" font-weight="600" text-anchor="end">Printed</text>
<text x="2215" y="432" font-size="23" fill="#201e1d" font-weight="600" text-anchor="end">Ratio</text>
<path d="M1352 453H2215" stroke="#bab6b6" stroke-width="1"/>
<text x="1352" y="494" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">African mean: 395.7 Mg/ha</text>
<text x="2070" y="494" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">2.86×</text>
<text x="2215" y="494" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">2.88×</text>
<text x="1352" y="544" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Amazonian value: 350 Mg/ha</text>
<text x="2070" y="544" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">3.23×</text>
<text x="2215" y="544" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">3.26×</text>
<text x="1352" y="594" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Amazonian value: 200 Mg/ha</text>
<text x="2070" y="594" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">5.65×</text>
<text x="2215" y="594" font-size="27" fill="#186D30" font-weight="600" text-anchor="end">5.71×</text>
<text x="1352" y="654" font-size="22" fill="#201e1d" font-weight="400" text-anchor="start">Factors compare different populations and estimators.</text>
<text x="1352" y="686" font-size="22" fill="#201e1d" font-weight="400" text-anchor="start">Each column changes only the class-5 convention.</text>
<rect x="52" y="749" width="2184" height="103" fill="#e8eee8" stroke="#186D30" stroke-width="1"/>
<text x="76" y="785" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Model-class edge 478: applies to assigned cell estimates if the class rules are implemented; not every field plot or subpixel patch.</text>
<text x="76" y="824" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">At weighted height 30 m: G = 30 / 40 m²/ha requires weighted ψ ≈ 2.1 / 1.6 at the ratio target. These are scenarios, not observed stands.</text>
<text x="52" y="895" font-size="26" fill="#006786" font-weight="600" text-anchor="start">FIVE EXPLANATIONS AND THE OBSERVATIONS THAT DISCRIMINATE THEM</text>
<rect x="52" y="918" width="2184" height="90" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="957" font-size="27" fill="#186D30" font-weight="600" text-anchor="start">1  Solid volume / architecture</text>
<text x="688" y="951" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Measure sound stems, branches, taper and cavities independently.</text>
<text x="688" y="985" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">A large ψ inferred from the carbon target does not test that target.</text>
<rect x="52" y="1008" width="2184" height="90" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="1047" font-size="27" fill="#186D30" font-weight="600" text-anchor="start">2  Material properties</text>
<text x="688" y="1041" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Measure paired density and carbon fractions across organs and strata.</text>
<text x="688" y="1075" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Lower β raises required wood volume; β is not an adjustable fit coefficient.</text>
<rect x="52" y="1098" width="2184" height="90" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="1137" font-size="27" fill="#186D30" font-weight="600" text-anchor="start">3  Remainder compartments</text>
<text x="688" y="1131" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Foliage ≈ 1.05% of dry mass in a harvested-tree subset; live epiphytes ≈ 2% in one stand.</text>
<text x="688" y="1165" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">A 65% carbon remainder is unsupported by these examples. Woody lianas stay in woody accounting.</text>
<rect x="52" y="1188" width="2184" height="90" fill="#f3f2f2" stroke="#bab6b6" stroke-width="1"/>
<text x="76" y="1227" font-size="27" fill="#186D30" font-weight="600" text-anchor="start">4  Spatial population selection</text>
<text x="688" y="1221" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Match the class map to independent, representative field strata and sampling weights.</text>
<text x="688" y="1255" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Different forest populations can differ physically; a selected exceptional hectare is insufficient.</text>
<rect x="52" y="1278" width="2184" height="90" fill="#e8eee8" stroke="#186D30" stroke-width="2"/>
<text x="76" y="1317" font-size="27" fill="#186D30" font-weight="600" text-anchor="start">5  Mapped target overestimated</text>
<text x="688" y="1311" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Test map calibration, out-of-domain prediction and Baccini/Simard predictor discrimination.</text>
<text x="688" y="1345" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Held-out plots and negative residuals beyond a prespecified margin discriminate upward map bias.</text>
<path d="M52 1390H2236" stroke="#201e1d" stroke-width="2"/>
<text x="52" y="1433" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">DECISION: compare a joint-uncertainty interval for R with a prespecified equivalence margin in both directions.</text>
<text x="52" y="1471" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Current empirical application: Córdoba aggregates are reproduced; independent volume and matched map values are missing, so R is unidentified.</text>
<text x="52" y="1509" font-size="24" fill="#201e1d" font-weight="400" text-anchor="start">Foliage and epiphyte examples are population-specific. A 10% remainder screen is an explicit scenario, not a universal ecological ceiling.</text>
<text x="52" y="1574" font-size="22" fill="#201e1d" font-weight="400" text-anchor="start">Sources: Arellano-P. &amp; Rangel-Ch. (2016); Lewis (2013); Malhi (2006); Higuchi (1998); Gómez González (2017); Vásquez &amp; Arellano (2012).</text>
</svg>